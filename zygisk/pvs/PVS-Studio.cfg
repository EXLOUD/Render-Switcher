# Параметри запуску PVS-Studio (CompilerCommandsAnalyzer.exe --cfg).
# Формат: key=value; коментарі - лише окремими рядками з '#'.
# Довідка: https://pvs-studio.com/en/docs/manual/6615/

# Тип препроцесора. Бібліотека збирається clang з Android NDK.
# Платформу (linux64 / linux32) analyze-pvs.bat виставляє сам за ABI.
preprocessor=clang

# Групи діагностик - сума бітів: 1 (64-bit) + 4 (GA) + 8 (OP) = 13.
# Числовий запис навмисно: голе "64" читається як 64 = AUTOSAR.
analysis-mode=13

# Не показувати попередження рівня достовірності 3 (найшумніші).
# no-noise=true

# Ліцензійний файл (шлях відносно цієї теки). Якщо ліцензію активовано
# через PVS-Studio, зазвичай це не потрібно:
# https://pvs-studio.com/en/docs/manual/0046/
# lic-file=PVS-Studio.lic
